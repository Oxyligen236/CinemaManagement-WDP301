services:
  backend:
    image: ghcr.io/oxyligen236/wdp-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wdp-backend
    restart: always
    env_file:
      - backend/.env
    ports:
      - "8010:8010"

  frontend:
    image: ghcr.io/oxyligen236/wdp-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wdp-frontend
    restart: always
    env_file:
      - frontend/.env
    ports:
      - "3000:3000"
